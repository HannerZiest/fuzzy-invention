<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UV Material Painter | PBR Map Generator</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* avoid accidental text selection while drawing */
    }

    :root {
      --bg: #0a0a0c;
      --panel: #111114;
      --panel2: #18181c;
      --border: #2a2a30;
      --accent: #ff7b2c;
      --accent-glow: rgba(255, 123, 44, 0.2);
      --text: #eaeef2;
      --muted: #8e8e9a;
      --mono: 'JetBrains Mono', 'SF Mono', monospace;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* header */
    .app-header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
    }
    .logo {
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      font-size: 14px;
    }
    .stepper {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
    }
    .step {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      color: var(--muted);
      border-radius: 20px;
      transition: 0.1s;
    }
    .step.active {
      background: var(--accent-glow);
      color: var(--accent);
    }
    .step.done {
      color: var(--text);
    }
    button {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.1s;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: black;
      font-weight: 600;
    }
    button:hover {
      filter: brightness(1.1);
      border-color: var(--accent);
    }
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    .stage {
      display: none;
      width: 100%;
      height: 100%;
      overflow: auto;
      padding: 24px;
    }
    .stage.active {
      display: flex;
      flex-direction: column;
    }
    .footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }
    .footer .spacer {
      flex: 1;
    }
    .info-text {
      font-size: 11px;
      color: var(--muted);
    }

    /* draw toolbar & canvas zoom/pan */
    .draw-layout {
      display: flex;
      flex: 1;
      gap: 16px;
      overflow: hidden;
    }
    .draw-canvas-area {
      flex: 1;
      background: #050505;
      border-radius: 8px;
      overflow: auto;
      position: relative;
      border: 1px solid var(--border);
    }
    .draw-canvas-area canvas {
      display: block;
      transform-origin: 0 0;
      cursor: crosshair;
    }
    .draw-tools {
      width: 260px;
      background: var(--panel);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .tool-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: var(--panel2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 20px;
      font-size: 12px;
    }
    .tool-btn.active {
      background: var(--accent);
      color: black;
      border-color: var(--accent);
    }
    .material-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .material-pill.active {
      background: var(--accent-glow);
    }
    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .shape-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 11px;
    }

    /* quality grid */
    .quality-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .quality-card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      cursor: pointer;
    }
    .quality-card.selected {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    /* albedo grid */
    .albedo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .albedo-card {
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
    }
    .albedo-preview {
      aspect-ratio: 1;
      background: #1e1e24;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px dashed var(--border);
      overflow: hidden;
    }
    .albedo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* tune panel */
    .tune-layout {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }
    .tune-3d {
      flex: 2;
      min-width: 300px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1;
    }
    .tune-3d canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .tune-controls {
      flex: 1;
      min-width: 260px;
      background: var(--panel);
      border-radius: 12px;
      padding: 18px;
      overflow-y: auto;
    }
    .slider-group {
      margin-bottom: 16px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }
    input[type="range"] {
      width: 100%;
      margin: 6px 0;
      background: var(--panel2);
      height: 3px;
      -webkit-appearance: none;
    }
    input[type="range"]:focus {
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 0;
      cursor: pointer;
    }

    .maps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .map-preview {
      background: var(--panel);
      border-radius: 8px;
      padding: 8px;
    }
    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: var(--accent);
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: 0.15s;
      z-index: 200;
    }
  </style>
</head>
<body>

<div class="app-header">
  <div class="logo">UV·PAINTER</div>
  <div class="stepper" id="stepper"></div>
  <button id="resetBtn">⟳ Reset</button>
</div>

<div class="main" id="mainStage">
  <!-- each stage injected dynamically -->
</div>

<div class="footer">
  <button id="backBtn">← Back</button>
  <div class="spacer"></div>
  <div class="info-text" id="stepInfo">Step 0: Quality</div>
  <div class="spacer"></div>
  <button id="nextBtn" class="primary">Next →</button>
</div>
<div id="toastMsg" class="toast"></div>

<script type="module">
  // ------------------- STATE -------------------
  let currentStep = 0;
  const steps = ['quality', 'upload', 'crop', 'materials', 'draw', 'albedos', 'tune', 'export'];
  
  let exportRes = 1024;          // default midground
  let originalUVImage = null;    // raw uploaded image
  let croppedUVCanvas = null;    // final 1:1 cropped UV
  let uvWidth = 0, uvHeight = 0;
  
  let materials = [
    { id: 'mat1', name: 'Wood', color: '#b87c4f', albedoImg: null, roughnessBase: 0.55, roughnessContrast: 1.0, metallic: 0.0, specular: 0.5, normalStrength: 2.2, tileScale: 1.0, tileRot: 0, sheen: 0, sheenEnabled: false },
    { id: 'mat2', name: 'Metal', color: '#aaaab0', albedoImg: null, roughnessBase: 0.2, roughnessContrast: 1.2, metallic: 0.95, specular: 0.5, normalStrength: 1.8, tileScale: 1.0, tileRot: 0, sheen: 0, sheenEnabled: false },
    { id: 'mat3', name: 'Fabric', color: '#6a8a9a', albedoImg: null, roughnessBase: 0.8, roughnessContrast: 1.0, metallic: 0.0, specular: 0.4, normalStrength: 2.5, tileScale: 1.0, tileRot: 0, sheen: 0, sheenEnabled: false }
  ];
  let shapes = []; // { id, materialId, points: [{x,y}] }
  let activeMaterialId = materials[0].id;
  let currentPolygonPoints = [];
  let nextShapeId = 100;
  
  // drawing transform (pan + zoom)
  let drawZoom = 1.0;
  let drawPanX = 0, drawPanY = 0;
  let isPanning = false;
  let lastPanX = 0, lastPanY = 0;
  
  // tune 3d lazy
  let threeRenderer = null, threeScene = null, threeCamera = null, threeMesh = null, threeMaterialObj = null;
  let tuneIndex = 0;
  let threeActive = false;
  
  // UI helpers
  function toast(msg) {
    const el = document.getElementById('toastMsg');
    el.textContent = msg;
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 1800);
  }
  
  function renderStepper() {
    const container = document.getElementById('stepper');
    container.innerHTML = steps.map((s, idx) => `<div class="step ${idx === currentStep ? 'active' : (idx < currentStep ? 'done' : '')}" data-step="${idx}">${idx}. ${s.toUpperCase()}</div>`).join('');
    document.querySelectorAll('.step').forEach(el => {
      el.addEventListener('click', () => setStep(parseInt(el.dataset.step)));
    });
    document.getElementById('stepInfo').innerText = `Step ${currentStep}: ${steps[currentStep]}`;
  }
  
  function setStep(step) {
    if (step < 0 || step >= steps.length) return;
    if (step === 2 && !croppedUVCanvas && originalUVImage) {
      toast('Please crop the image first');
      return;
    }
    if (step === 3 && !croppedUVCanvas) { toast('Need a cropped UV'); return; }
    if (step === 4 && shapes.length === 0 && currentStep === 3) { toast('Add at least one material'); return; }
    currentStep = step;
    renderStepper();
    renderCurrentStage();
  }
  
  // ---------- Helper: crop canvas ----------
  async function applyCrop(cropRect) {
    if (!originalUVImage) return;
    const size = Math.min(originalUVImage.width, originalUVImage.height);
    const sx = cropRect?.x ?? ((originalUVImage.width - size)/2);
    const sy = cropRect?.y ?? ((originalUVImage.height - size)/2);
    const sz = cropRect?.size ?? size;
    const canvas = document.createElement('canvas');
    canvas.width = sz;
    canvas.height = sz;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(originalUVImage, sx, sy, sz, sz, 0, 0, sz, sz);
    croppedUVCanvas = canvas;
    uvWidth = sz;
    uvHeight = sz;
    toast(`UV cropped to ${sz}×${sz}`);
  }
  
  // ---------- DRAWING: zoom/pan and polygon ----------
  function initDrawCanvas(canvas, container) {
    if (!croppedUVCanvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = croppedUVCanvas.width;
    canvas.height = croppedUVCanvas.height;
    
    function redraw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(croppedUVCanvas, 0, 0);
      // draw shapes
      shapes.forEach(shape => {
        const mat = materials.find(m => m.id === shape.materialId);
        if (!mat) return;
        ctx.fillStyle = mat.color + '99';
        ctx.beginPath();
        ctx.moveTo(shape.points[0].x, shape.points[0].y);
        for(let i=1;i<shape.points.length;i++) ctx.lineTo(shape.points[i].x, shape.points[i].y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = mat.color;
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      // current drawing points
      if (currentPolygonPoints.length > 0) {
        ctx.strokeStyle = '#ffaa44';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(currentPolygonPoints[0].x, currentPolygonPoints[0].y);
        for(let i=1;i<currentPolygonPoints.length;i++) ctx.lineTo(currentPolygonPoints[i].x, currentPolygonPoints[i].y);
        ctx.stroke();
        for(let p of currentPolygonPoints) {
          ctx.fillStyle = '#ffaa44';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, 2*Math.PI);
          ctx.fill();
        }
      }
    }
    
    function updateTransform() {
      const wrap = container;
      const scale = drawZoom;
      const w = canvas.width * scale;
      const h = canvas.height * scale;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      canvas.style.transform = `translate(${drawPanX}px, ${drawPanY}px)`;
      redraw();
    }
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      drawZoom = Math.min(8, Math.max(0.3, drawZoom * delta));
      updateTransform();
    });
    
    let isPan = false;
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 1 || e.ctrlKey) {
        isPan = true;
        lastPanX = e.clientX;
        lastPanY = e.clientY;
        canvas.style.cursor = 'grabbing';
        e.preventDefault();
      } else {
        // polygon drawing
        const rect = canvas.getBoundingClientRect();
        const sx = (e.clientX - rect.left) / rect.width;
        const sy = (e.clientY - rect.top) / rect.height;
        const canvasX = sx * canvas.width;
        const canvasY = sy * canvas.height;
        if (currentPolygonPoints.length > 2 && 
            Math.hypot(canvasX - currentPolygonPoints[0].x, canvasY - currentPolygonPoints[0].y) < 12) {
          // close polygon
          if (currentPolygonPoints.length >= 3) {
            shapes.push({
              id: nextShapeId++,
              materialId: activeMaterialId,
              points: [...currentPolygonPoints]
            });
            currentPolygonPoints = [];
            redraw();
            renderMaterialsSidebar();
            toast('Shape added');
          }
        } else {
          currentPolygonPoints.push({ x: canvasX, y: canvasY });
          redraw();
        }
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (isPan) {
        const dx = e.clientX - lastPanX;
        const dy = e.clientY - lastPanY;
        drawPanX += dx;
        drawPanY += dy;
        lastPanX = e.clientX;
        lastPanY = e.clientY;
        updateTransform();
      }
    });
    window.addEventListener('mouseup', () => {
      isPan = false;
      canvas.style.cursor = 'crosshair';
    });
    updateTransform();
    return { redraw: updateTransform };
  }
  
  // ---------- 3D Tune (Lazy) ----------
  async function initThree() {
    if (threeRenderer) return;
    const THREE = await import('https://unpkg.com/three@0.128.0/build/three.module.js');
    const container = document.getElementById('threeContainer');
    if (!container) return;
    const width = container.clientWidth;
    const height = container.clientHeight;
    threeRenderer = new THREE.WebGLRenderer({ antialias: true });
    threeRenderer.setSize(width, height);
    threeRenderer.setPixelRatio(window.devicePixelRatio);
    container.innerHTML = '';
    container.appendChild(threeRenderer.domElement);
    
    threeScene = new THREE.Scene();
    threeScene.background = new THREE.Color(0x000000);
    threeCamera = new THREE.PerspectiveCamera(35, width/height, 0.1, 100);
    threeCamera.position.set(0, 0, 3);
    const ambient = new THREE.AmbientLight(0x404040);
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(2, 2, 1);
    threeScene.add(ambient, key);
    const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    threeMaterialObj = new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.0 });
    threeMesh = new THREE.Mesh(geo, threeMaterialObj);
    threeScene.add(threeMesh);
    
    let rotating = true;
    let mouseX = 0, mouseY = 0;
    threeRenderer.domElement.addEventListener('mousedown', (e) => { rotating = false; mouseX = e.clientX; mouseY = e.clientY; });
    window.addEventListener('mousemove', (e) => {
      if (!rotating && threeMesh) {
        const dx = e.clientX - mouseX;
        const dy = e.clientY - mouseY;
        threeMesh.rotation.y += dx * 0.01;
        threeMesh.rotation.x += dy * 0.01;
        mouseX = e.clientX; mouseY = e.clientY;
      }
    });
    window.addEventListener('mouseup', () => { rotating = true; });
    function animate() {
      if (!threeRenderer) return;
      if (rotating && threeMesh) threeMesh.rotation.y += 0.008;
      if (threeCamera) threeRenderer.render(threeScene, threeCamera);
      requestAnimationFrame(animate);
    }
    animate();
    threeActive = true;
  }
  
  async function updateTuneMaterial(index) {
    if (!threeMaterialObj) await initThree();
    const mat = materials[tuneIndex];
    if (!mat) return;
    // generate simple placeholder albedo map if none
    let albedoTex = null;
    if (mat.albedoImg) {
      const tex = new (await import('three')).CanvasTexture(mat.albedoImg);
      tex.wrapS = tex.wrapT = 1000;
      tex.repeat.set(mat.tileScale, mat.tileScale);
      tex.rotation = mat.tileRot * Math.PI/180;
      albedoTex = tex;
    }
    threeMaterialObj.map = albedoTex;
    threeMaterialObj.color = albedoTex ? 0xffffff : new (await import('three')).Color(mat.color);
    threeMaterialObj.roughness = mat.roughnessBase;
    threeMaterialObj.metalness = mat.metallic;
    threeMaterialObj.needsUpdate = true;
  }
  
  // ---------- Composite final maps ----------
  function compositeMaps() {
    const size = exportRes;
    const albedoCanvas = document.createElement('canvas'); albedoCanvas.width = size; albedoCanvas.height = size;
    const normalCanvas = document.createElement('canvas'); normalCanvas.width = size; normalCanvas.height = size;
    const roughCanvas = document.createElement('canvas'); roughCanvas.width = size; roughCanvas.height = size;
    const metallicCanvas = document.createElement('canvas'); metallicCanvas.width = size; metallicCanvas.height = size;
    const aoCanvas = document.createElement('canvas'); aoCanvas.width = size; aoCanvas.height = size;
    const specCanvas = document.createElement('canvas'); specCanvas.width = size; specCanvas.height = size;
    
    const ctxAlbedo = albedoCanvas.getContext('2d');
    const ctxNormal = normalCanvas.getContext('2d');
    const ctxRough = roughCanvas.getContext('2d');
    const ctxMetal = metallicCanvas.getContext('2d');
    const ctxAO = aoCanvas.getContext('2d');
    const ctxSpec = specCanvas.getContext('2d');
    
    const scaleX = size / uvWidth;
    const scaleY = size / uvHeight;
    
    // helper to fill clipped region
    function fillShape(ctx, shape, fillFn) {
      ctx.beginPath();
      ctx.moveTo(shape.points[0].x * scaleX, shape.points[0].y * scaleY);
      for(let i=1;i<shape.points.length;i++) ctx.lineTo(shape.points[i].x * scaleX, shape.points[i].y * scaleY);
      ctx.closePath();
      ctx.save();
      ctx.clip();
      fillFn(ctx);
      ctx.restore();
    }
    
    // fill backgrounds black/grey
    ctxAlbedo.fillStyle = '#000'; ctxAlbedo.fillRect(0,0,size,size);
    ctxNormal.fillStyle = '#8080ff'; ctxNormal.fillRect(0,0,size,size);
    ctxRough.fillStyle = '#808080'; ctxRough.fillRect(0,0,size,size);
    ctxMetal.fillStyle = '#000000'; ctxMetal.fillRect(0,0,size,size);
    ctxAO.fillStyle = '#ffffff'; ctxAO.fillRect(0,0,size,size);
    ctxSpec.fillStyle = '#808080'; ctxSpec.fillRect(0,0,size,size);
    
    for(let shape of shapes) {
      const mat = materials.find(m => m.id === shape.materialId);
      if (!mat) continue;
      // Albedo
      if (mat.albedoImg) {
        const patternCanvas = document.createElement('canvas');
        const patSize = 256;
        patternCanvas.width = patSize; patternCanvas.height = patSize;
        const pctx = patternCanvas.getContext('2d');
        pctx.drawImage(mat.albedoImg, 0, 0, patSize, patSize);
        const pattern = ctxAlbedo.createPattern(patternCanvas, 'repeat');
        fillShape(ctxAlbedo, shape, (ctx) => { ctx.fillStyle = pattern; ctx.fillRect(0,0,size,size); });
      } else {
        fillShape(ctxAlbedo, shape, (ctx) => { ctx.fillStyle = mat.color; ctx.fillRect(0,0,size,size); });
      }
      // Roughness
      let roughnessVal = mat.roughnessBase;
      fillShape(ctxRough, shape, (ctx) => { let v = Math.floor(roughnessVal*255); ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(0,0,size,size); });
      // Metallic
      let metalVal = Math.floor(mat.metallic * 255);
      fillShape(ctxMetal, shape, (ctx) => { ctx.fillStyle = `rgb(${metalVal},${metalVal},${metalVal})`; ctx.fillRect(0,0,size,size); });
      // Specular
      let specVal = Math.floor(mat.specular * 255);
      fillShape(ctxSpec, shape, (ctx) => { ctx.fillStyle = `rgb(${specVal},${specVal},${specVal})`; ctx.fillRect(0,0,size,size); });
      // Simple normal from albedo (quick)
      if (mat.albedoImg) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 512; tempCanvas.height = 512;
        const tctx = tempCanvas.getContext('2d');
        tctx.drawImage(mat.albedoImg, 0, 0, 512,512);
        const imgData = tctx.getImageData(0,0,512,512);
        const data = imgData.data;
        const normalData = new Uint8ClampedArray(512*512*4);
        for(let y=1; y<511; y++) {
          for(let x=1; x<511; x++) {
            const idx = (y*512 + x)*4;
            const l = data[idx-4]; const r = data[idx+4];
            const t = data[idx-512*4]; const b = data[idx+512*4];
            let dx = (r - l) / 255.0;
            let dy = (t - b) / 255.0;
            dx *= mat.normalStrength;
            dy *= mat.normalStrength;
            let dz = 1;
            let len = Math.hypot(dx,dy,dz);
            dx /= len; dy /= len; dz /= len;
            normalData[idx] = (dx*0.5+0.5)*255;
            normalData[idx+1] = (dy*0.5+0.5)*255;
            normalData[idx+2] = (dz*0.5+0.5)*255;
            normalData[idx+3] = 255;
          }
        }
        const normalImg = new ImageData(normalData,512,512);
        const normalCanvasSrc = document.createElement('canvas');
        normalCanvasSrc.width = 512; normalCanvasSrc.height = 512;
        normalCanvasSrc.getContext('2d').putImageData(normalImg,0,0);
        const patternNorm = ctxNormal.createPattern(normalCanvasSrc, 'repeat');
        fillShape(ctxNormal, shape, (ctx) => { ctx.fillStyle = patternNorm; ctx.fillRect(0,0,size,size); });
      } else {
        fillShape(ctxNormal, shape, (ctx) => { ctx.fillStyle = '#8080ff'; ctx.fillRect(0,0,size,size); });
      }
      // AO quick approximation
      fillShape(ctxAO, shape, (ctx) => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,size,size); });
    }
    return { albedo: albedoCanvas, normal: normalCanvas, roughness: roughCanvas, metallic: metallicCanvas, ao: aoCanvas, specular: specCanvas };
  }
  
  // ---------- UI RENDERING ----------
  async function renderCurrentStage() {
    const container = document.getElementById('mainStage');
    const stage = steps[currentStep];
    if (stage === 'quality') {
      container.innerHTML = `<div class="stage active">
        <h2>Output Resolution</h2><div class="quality-grid" id="qualityGrid">
          <div class="quality-card" data-res="2048"><div>2048x2048</div><small>Hero / close-up</small></div>
          <div class="quality-card selected" data-res="1024"><div>1024x1024</div><small>Midground</small></div>
          <div class="quality-card" data-res="512"><div>512x512</div><small>Background</small></div>
          <div class="quality-card" data-res="256"><div>256x256</div><small>Ultra far</small></div>
        </div></div>`;
      document.querySelectorAll('.quality-card').forEach(c => {
        c.addEventListener('click', () => {
          document.querySelectorAll('.quality-card').forEach(c2=>c2.classList.remove('selected'));
          c.classList.add('selected');
          exportRes = parseInt(c.dataset.res);
          toast(`Export resolution: ${exportRes}`);
        });
      });
    } 
    else if (stage === 'upload') {
      container.innerHTML = `<div class="stage active"><div class="dropzone" style="border:2px dashed #444;padding:40px;text-align:center;width:400px;margin:auto;"><input type="file" id="uvFileInput" accept="image/*"><div id="uvPreview"></div></div></div>`;
      const input = document.getElementById('uvFileInput');
      input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(r => img.onload = r);
        originalUVImage = img;
        await applyCrop(); // default center crop
        toast('UV uploaded, go to crop step');
        setStep(2);
      });
    }
    else if (stage === 'crop') {
      if(!originalUVImage) { setStep(1); return; }
      container.innerHTML = `<div class="stage active"><h3>Crop to Square</h3><canvas id="cropCanvas" style="max-width:90%;border:1px solid gray;"></canvas><br><button id="confirmCropBtn">Confirm & Continue</button></div>`;
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');
      const size = Math.min(originalUVImage.width, originalUVImage.height);
      canvas.width = size; canvas.height = size;
      ctx.drawImage(originalUVImage, (originalUVImage.width-size)/2, (originalUVImage.height-size)/2, size, size, 0,0,size,size);
      document.getElementById('confirmCropBtn').onclick = () => {
        croppedUVCanvas = canvas;
        uvWidth = size; uvHeight = size;
        setStep(3);
      };
    }
    else if (stage === 'materials') {
      container.innerHTML = `<div class="stage active"><div id="matList"></div><button id="addMatBtn">+ Add Material</button></div>`;
      function renderMatList() {
        const div = document.getElementById('matList');
        div.innerHTML = materials.map(mat => `<div style="display:flex;gap:8px;margin:8px;align-items:center;"><input type="color" value="${mat.color}" data-id="${mat.id}" class="matColor"><input value="${mat.name}" data-id="${mat.id}" class="matName"><button data-id="${mat.id}" class="delMat">✖</button></div>`).join('');
        document.querySelectorAll('.matColor').forEach(inp => inp.addEventListener('change', (e) => { let m = materials.find(x=>x.id===e.target.dataset.id); if(m) m.color = e.target.value; }));
        document.querySelectorAll('.matName').forEach(inp => inp.addEventListener('change', (e) => { let m = materials.find(x=>x.id===e.target.dataset.id); if(m) m.name = e.target.value; }));
        document.querySelectorAll('.delMat').forEach(btn => btn.addEventListener('click', (e) => { if(materials.length>1) { materials = materials.filter(m=>m.id !== e.target.dataset.id); renderMatList(); } else toast('Need at least one material'); }));
      }
      renderMatList();
      document.getElementById('addMatBtn').onclick = () => {
        materials.push({ id: 'mat'+Date.now(), name: 'New', color: '#ffaa55', albedoImg: null, roughnessBase: 0.5, roughnessContrast: 1, metallic: 0, specular: 0.5, normalStrength: 2, tileScale: 1, tileRot: 0, sheen: 0, sheenEnabled: false });
        renderMatList();
      };
    }
    else if (stage === 'draw') {
      if(!croppedUVCanvas) { setStep(2); return; }
      container.innerHTML = `<div class="stage active"><div class="draw-layout"><div class="draw-canvas-area"><canvas id="drawCanvas"></canvas></div><div class="draw-tools"><div><strong>Active Material</strong><div id="drawMatList"></div></div><div><strong>Shapes</strong><div id="shapeList"></div></div><div><button id="clearPolygonBtn">Cancel Polygon</button></div><div class="tool-group"><button id="zoomInDraw">Zoom +</button><button id="zoomOutDraw">Zoom -</button><button id="resetViewDraw">Reset View</button></div></div></div></div>`;
      const canvas = document.getElementById('drawCanvas');
      const wrap = document.querySelector('.draw-canvas-area');
      const { redraw } = initDrawCanvas(canvas, wrap);
      function renderMatSide() {
        const div = document.getElementById('drawMatList');
        div.innerHTML = materials.map(m => `<div class="material-pill ${activeMaterialId === m.id ? 'active' : ''}" data-id="${m.id}"><div class="color-swatch" style="background:${m.color}"></div><span>${m.name}</span></div>`).join('');
        document.querySelectorAll('.material-pill').forEach(el => el.addEventListener('click', () => { activeMaterialId = el.dataset.id; renderMatSide(); redraw(); }));
      }
      function renderShapesSide() {
        const div = document.getElementById('shapeList');
        div.innerHTML = shapes.map(s => { const mat = materials.find(m=>m.id===s.materialId); return `<div class="shape-item"><span>${mat?.name ?? '?'}</span><button class="delShape" data-id="${s.id}">✖</button></div>`; }).join('');
        document.querySelectorAll('.delShape').forEach(btn => btn.addEventListener('click', (e) => { shapes = shapes.filter(s => s.id !== parseInt(e.target.dataset.id)); renderShapesSide(); redraw(); }));
      }
      renderMatSide(); renderShapesSide();
      document.getElementById('clearPolygonBtn').onclick = () => { currentPolygonPoints = []; redraw(); };
      document.getElementById('zoomInDraw').onclick = () => { drawZoom *= 1.2; redraw(); };
      document.getElementById('zoomOutDraw').onclick = () => { drawZoom /= 1.2; redraw(); };
      document.getElementById('resetViewDraw').onclick = () => { drawZoom = 1.0; drawPanX = 0; drawPanY = 0; redraw(); };
    }
    else if (stage === 'albedos') {
      container.innerHTML = `<div class="stage active"><div class="albedo-grid" id="albedoGrid"></div></div>`;
      const grid = document.getElementById('albedoGrid');
      grid.innerHTML = materials.map(mat => `<div class="albedo-card"><strong>${mat.name}</strong><div class="albedo-preview" data-id="${mat.id}">${mat.albedoImg ? `<img src="${mat.albedoImg.src}">` : 'Click to upload'}</div><button class="removeAlbBtn" data-id="${mat.id}">Remove</button></div>`).join('');
      for(let mat of materials) {
        const preview = document.querySelector(`.albedo-preview[data-id="${mat.id}"]`);
        if(preview) preview.addEventListener('click', () => {
          const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
          input.onchange = async (e) => {
            const file = e.target.files[0];
            const img = new Image();
            img.src = URL.createObjectURL(file);
            await new Promise(r => img.onload = r);
            mat.albedoImg = img;
            renderCurrentStage();
          };
          input.click();
        });
        const rmBtn = document.querySelector(`.removeAlbBtn[data-id="${mat.id}"]`);
        if(rmBtn) rmBtn.addEventListener('click', () => { mat.albedoImg = null; renderCurrentStage(); });
      }
    }
    else if (stage === 'tune') {
      container.innerHTML = `<div class="stage active"><div class="tune-layout"><div class="tune-3d" id="threeContainer"></div><div class="tune-controls"><div><button id="prevMat">← Prev</button><button id="nextMat">Next →</button><span id="matName"></span></div><div class="slider-group"><label>Roughness Base <span id="roughVal"></span></label><input type="range" id="roughBase" min="0" max="1" step="0.01"></div><div class="slider-group"><label>Metallic</label><input type="range" id="metalSlider" min="0" max="1" step="0.01"></div><div class="slider-group"><label>Specular (IOR)</label><input type="range" id="specSlider" min="0" max="1" step="0.01"></div><div class="slider-group"><label>Normal Strength</label><input type="range" id="normStrength" min="0" max="5" step="0.1"></div><div class="slider-group"><label>Tile Scale</label><input type="range" id="tileScale" min="0.2" max="4" step="0.1"></div></div></div></div>`;
      tuneIndex = 0;
      await initThree();
      const update = async () => {
        const mat = materials[tuneIndex];
        document.getElementById('matName').innerText = mat.name;
        document.getElementById('roughBase').value = mat.roughnessBase;
        document.getElementById('roughVal').innerText = mat.roughnessBase;
        document.getElementById('metalSlider').value = mat.metallic;
        document.getElementById('specSlider').value = mat.specular;
        document.getElementById('normStrength').value = mat.normalStrength;
        document.getElementById('tileScale').value = mat.tileScale;
        await updateTuneMaterial(tuneIndex);
      };
      document.getElementById('roughBase').addEventListener('input', (e) => { materials[tuneIndex].roughnessBase = parseFloat(e.target.value); update(); });
      document.getElementById('metalSlider').addEventListener('input', (e) => { materials[tuneIndex].metallic = parseFloat(e.target.value); update(); });
      document.getElementById('specSlider').addEventListener('input', (e) => { materials[tuneIndex].specular = parseFloat(e.target.value); update(); });
      document.getElementById('normStrength').addEventListener('input', (e) => { materials[tuneIndex].normalStrength = parseFloat(e.target.value); update(); });
      document.getElementById('tileScale').addEventListener('input', (e) => { materials[tuneIndex].tileScale = parseFloat(e.target.value); update(); });
      document.getElementById('prevMat').onclick = () => { tuneIndex = (tuneIndex-1+materials.length)%materials.length; update(); };
      document.getElementById('nextMat').onclick = () => { tuneIndex = (tuneIndex+1)%materials.length; update(); };
      update();
    }
    else if (stage === 'export') {
      if(shapes.length === 0) { toast('No shapes drawn'); setStep(4); return; }
      const maps = compositeMaps();
      container.innerHTML = `<div class="stage active"><div class="maps-grid" id="exportGrid"></div><button id="dlAllBtn" class="primary">Download All</button></div>`;
      const grid = document.getElementById('exportGrid');
      const mapList = [['albedo', maps.albedo],['normal', maps.normal],['roughness', maps.roughness],['metallic', maps.metallic],['ao', maps.ao],['specular', maps.specular]];
      mapList.forEach(([name, canvas]) => {
        const div = document.createElement('div');
        div.className = 'map-preview';
        div.innerHTML = `<strong>${name.toUpperCase()}</strong><canvas width="128" height="128" style="width:100%;background:#111;"></canvas><button class="dlSingle">Download</button>`;
        const smallCanvas = div.querySelector('canvas');
        const ctxSmall = smallCanvas.getContext('2d');
        ctxSmall.drawImage(canvas, 0,0,128,128);
        div.querySelector('.dlSingle').onclick = () => { const a = document.createElement('a'); a.href = canvas.toDataURL(); a.download = `${name}.png`; a.click(); };
        grid.appendChild(div);
      });
      document.getElementById('dlAllBtn').onclick = () => {
        mapList.forEach(([name,canvas]) => { const a = document.createElement('a'); a.href = canvas.toDataURL(); a.download = `${name}.png`; a.click(); });
        toast('Downloading all maps');
      };
    }
  }
  
  document.getElementById('backBtn').addEventListener('click', () => setStep(currentStep-1));
  document.getElementById('nextBtn').addEventListener('click', () => {
    if(currentStep === 4 && shapes.length === 0) { toast('Draw at least one shape'); return; }
    if(currentStep === 1 && !originalUVImage) { toast('Upload UV'); return; }
    setStep(currentStep+1);
  });
  document.getElementById('resetBtn').addEventListener('click', () => { location.reload(); });
  
  renderStepper();
  renderCurrentStage();
</script>
</body>
</html>
